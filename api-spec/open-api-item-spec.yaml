openapi: 3.0.3
info:
  title: Item API
  description: API for managing game items.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
servers:
  - url: http://localhost:9071/v1
    description: Local server
  - url: https://backend-gameserver-five.vercel.app/v1
    description: Production server

paths:
  /items:
    get:
      summary: Get all items
      description: Retrieves a paginated list of items.
      operationId: getItems
      tags:
        - Items
      parameters:
        - name: limit
          in: query
          description: Maximum number of items to return
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of items to skip (for pagination)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: List of items successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPageOv1'
              example:
                content:
                  - itemId: "123e4567-e89b-12d3-a456-426614174000"
                    itemName: "Iron Sword"
                    description: "A reliable starter weapon."
                    category: "weapon"
                    price: 999.99
                    createdAt: "2024-01-15T10:30:00Z"
                    updatedAt: "2024-01-15T10:30:00Z"
                  - itemId: "456e7890-e12b-34d5-b678-901234567890"
                    itemName: "Health Potion"
                    description: "Restores a small amount of health."
                    category: "consumable"
                    price: 699.99
                    createdAt: "2024-01-14T15:20:00Z"
                    updatedAt: "2024-01-14T15:20:00Z"
                total: 150
                limit: 20
                offset: 0
                hasNext: true
                hasPrevious: false
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'

  /item:
    post:
      summary: Create new item
      description: Creates a new item with the provided data.
      operationId: createItem
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemOv1'
            example:
              itemName: "Iron Sword"
              description: "A reliable starter weapon."
              category: "weapon"
              price: 29.99
      responses:
        '201':
          description: Item successfully created
          content:
            application/json:
              schema:
                type: string
                format: uuid
                nullable: false
              example: "123e4567-e89b-12d3-a456-426614174000"
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'

  /item/{itemId}:
    get:
      summary: Get single item
      description: Retrieves a specific item by its ID.
      operationId: getItemById
      tags:
        - Items
      parameters:
        - name: itemId
          in: path
          description: Unique ID of the item
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Item successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemOv1'
              example:
                itemId: "123e4567-e89b-12d3-a456-426614174000"
                itemName: "Iron Sword"
                description: "A reliable starter weapon."
                category: "weapon"
                price: 999.99
                createdAt: "2024-01-15T10:30:00Z"
                updatedAt: "2024-01-15T10:30:00Z"
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'
        '400':
          description: Invalid item ID
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'

    put:
      summary: Update item
      description: Updates an existing item by its ID.
      operationId: updateItem
      tags:
        - Items
      parameters:
        - name: itemId
          in: path
          description: Unique ID of the item to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemOv1'
            example:
              itemName: "Steel Sword"
              description: "A stronger sword for experienced fighters."
              category: "weapon"
              price: 1499.99
      responses:
        '200':
          description: Item successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemOv1'
        '400':
          description: Invalid input data or item ID
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'

    delete:
      summary: Delete item
      description: Deletes a specific item by its ID.
      operationId: deleteItem
      tags:
        - Items
      parameters:
        - name: itemId
          in: path
          description: Unique ID of the item to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Item successfully deleted
          content:
            application/json:
              schema:
                type: string
                format: uuid
                nullable: false
              example: "123e4567-e89b-12d3-a456-426614174000"
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'
        '400':
          description: Invalid item ID
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './open-api-error-spec.yaml#/components/schemas/Error'

components:
  schemas:
    ItemOv1:
      type: object
      required:
        - itemId
        - itemName
        - category
        - price
        - createdAt
        - updatedAt
      properties:
        itemId:
          type: string
          description: Unique identifier of the item
          format: uuid
          readOnly: true
          nullable: false
          example: "123e4567-e89b-12d3-a456-426614174000"
        itemName:
          type: string
          description: Name of the item
          minLength: 1
          maxLength: 255
          nullable: false
          example: "Magical Sword of the Church"
        description:
          type: string
          description: Description of the item
          maxLength: 255
          nullable: false
          example: "A sword carried by a church fighter."
        category:
          type: string
          description: Category of the item
          enum: [ "weapon", "armor", "accessories", "consumable", "other" ]
          nullable: false
          example: "weapon"
        price:
          type: number
          format: double
          description: Price of the item in gold
          minimum: 0
          nullable: false
          example: 999
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          readOnly: true
          nullable: false
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          readOnly: true
          nullable: false
          example: "2024-01-15T10:30:00Z"

    ItemPageOv1:
      type: object
      required:
        - content
        - total
        - limit
        - offset
        - hasNext
        - hasPrevious
      properties:
        content:
          type: array
          nullable: false
          items:
            $ref: "#/components/schemas/ItemOv1"
        total:
          type: integer
          description: Total number of available items
          nullable: false
          example: 150
        limit:
          type: integer
          description: Maximum number of returned items
          nullable: false
          example: 20
        offset:
          type: integer
          description: Number of skipped items
          nullable: false
          example: 0
        hasNext:
          type: boolean
          description: Indicates if more items are available
          nullable: false
          example: true
        hasPrevious:
          type: boolean
          description: Indicates if previous items are available
          nullable: false
          example: false
